name: Daily Stock Scan

on:
  schedule:
    - cron: "15 11 * * 1-5"   # 4:45 PM IST, Monday–Friday
  workflow_dispatch:           # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Scan the market
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/data.json data/
          git commit -m "Daily scan $(TZ=Asia/Kolkata date +'%d %b %Y')" || echo "Nothing new"
          git pull --rebase
          git push
